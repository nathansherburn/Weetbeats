<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      No title. macOS draws the window title over the top of the window when the title bar
      is an overlay, which lands it on the transport; the project's name is in the header
      instead. The window's own title is empty in tauri.conf.json for the same reason.
    -->
    <title></title>
    <!-- Stops the webview asking for a favicon that is not there. -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      The drag region has to be on every element you might grab the window by: the webview
      only starts a drag when the thing under the pointer is marked. Controls are not, so
      they still work as controls.
    -->
    <header class="transport" data-tauri-drag-region>
      <div class="controls" data-tauri-drag-region>
        <button id="play" class="play" title="Play or stop (space)" aria-label="Play">
          <span class="glyph">&#9654;</span>
        </button>

        <label class="dial" title="Tempo — drag up and down, scroll, or click and type">
          <span class="dial-label">bpm</span>
          <input id="bpm" class="number" type="text" inputmode="decimal" value="120" />
        </label>

        <div class="dial" title="Output level">
          <span class="dial-label">out</span>
          <div class="meter">
            <div class="meter-fill" id="meterFill"></div>
          </div>
        </div>
      </div>

      <div class="drag-space" data-tauri-drag-region></div>

      <div class="meta">
        <span class="project-name" id="projectName" title="">Untitled</span>
        <span class="status" id="status"></span>
      </div>
    </header>

    <main>
      <!--
        The patterns panel. Down the left in the song view, and still there while a pattern
        is open, because that is how you get to the next one.
      -->
      <aside class="patterns">
        <!--
          The heading is the way back to the song: the patterns below are windows over it,
          and this is the desk they sit on.
        -->
        <div class="panel-head">
          <button id="songMode" class="song-mode" title="Back to the song (esc)">song</button>
        </div>
        <div class="pattern-list" id="patternList"></div>
        <!-- Under the patterns, where the next one would go. -->
        <button id="addPattern" class="add-row" title="New pattern">+ pattern</button>
      </aside>

      <!-- The song sits underneath; a pattern opens on top of it, like a window. -->
      <section class="workspace">
        <div class="song" id="song">
          <div class="song-scroll" id="songScroll">
            <div class="song-grid">
              <canvas id="scrubber" class="scrubber" title="Click or drag to play from here"></canvas>
              <canvas id="lanes" class="lanes"></canvas>
            </div>
          </div>
          <div class="hint" id="songHint">
            <p>Click a pattern on the left to open it.</p>
            <p class="small">
              Then paint it across the bars here. Patterns in the same bar play together.
            </p>
          </div>
        </div>

        <!-- The pattern editor: the step grid, and the instruments it plays. -->
        <div class="editor hidden" id="editor">
          <div class="editor-scroll" id="editorScroll">
            <div class="editor-grid">
              <div class="corner">
                <span class="head-label">steps</span>
                <span class="steps" title="How many boxes this pattern has">
                  <button id="fewerSteps" class="tick" aria-label="One box fewer">&minus;</button>
                  <input id="steps" class="number" type="text" inputmode="numeric" value="16" />
                  <button id="moreSteps" class="tick" aria-label="One box more">+</button>
                </span>
              </div>
              <canvas id="ruler" class="ruler"></canvas>
              <!-- The instruments, and under them the way to add another. -->
              <div class="header-col">
                <div class="track-headers" id="trackHeaders"></div>
                <button id="add" class="add-row" title="Add an instrument">+ instrument</button>
              </div>
              <canvas id="grid" class="grid"></canvas>
            </div>
          </div>
          <button id="closePattern" class="close" title="Close this pattern (esc)">&times;</button>
          <div class="empty" id="empty">
            <button id="addBig" class="add-big">Add an instrument</button>
            <p class="small">Or drop a sound on the window. Then tick some boxes and hit space.</p>
          </div>
        </div>

        <!--
          The piano roll: the same pattern, one track, seen as notes instead of boxes. Keys
          down the left, the notes in the middle, how hard each one is hit underneath.
        -->
        <div class="roll hidden" id="roll">
          <div class="roll-scroll" id="rollScroll">
            <div class="roll-grid">
              <div class="corner">
                <span class="roll-name" id="rollName"></span>
                <button id="oneShot" class="add" title="Let the notes ring out instead">
                  held
                </button>
              </div>
              <canvas id="rollRuler" class="ruler"></canvas>
              <canvas id="keys" class="keys" title="Click a key to hear it"></canvas>
              <canvas id="notes" class="notes"></canvas>
              <div class="corner vel-corner"><span class="head-label">hit</span></div>
              <div class="vel-lane"><canvas id="velocity" class="velocity"></canvas></div>
            </div>
          </div>
          <button id="closeRoll" class="close" title="Back to the boxes (esc)">&times;</button>
        </div>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
