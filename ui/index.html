<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weetbeats</title>
    <!-- Stops the webview asking for a favicon that is not there. -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="transport" data-tauri-drag-region>
      <div class="brand">weetbeats</div>

      <div class="controls">
        <button id="play" class="play" title="Play or stop (space)" aria-label="Play">
          <span class="glyph">&#9654;</span>
        </button>

        <label class="dial" title="Tempo">
          <span class="dial-label">bpm</span>
          <input id="bpm" type="range" min="40" max="240" step="1" value="120" />
          <output id="bpmValue">120</output>
        </label>

        <label class="dial" title="Master volume">
          <span class="dial-label">out</span>
          <input id="master" type="range" min="0" max="120" step="1" value="90" />
        </label>

        <div class="meter" title="Output level">
          <div class="meter-fill" id="meterFill"></div>
        </div>
      </div>

      <div class="status" id="status"></div>
    </header>

    <main>
      <aside class="browser">
        <div class="browser-head">
          <button id="choose" class="ghost">Choose folder&hellip;</button>
          <input id="filter" type="search" placeholder="Search samples" autocomplete="off" />
        </div>
        <div class="browser-root" id="browserRoot"></div>
        <ul id="samples" class="sample-list"></ul>
        <p class="hint">Click to hear it. Drag it right to make a track.</p>
      </aside>

      <section class="pattern" id="pattern">
        <div class="pattern-head">
          <div class="head-tracks">tracks</div>
          <canvas id="ruler" class="ruler"></canvas>
        </div>
        <div class="pattern-body" id="patternBody">
          <div class="track-headers" id="trackHeaders"></div>
          <div class="grid-wrap">
            <canvas id="grid" class="grid"></canvas>
          </div>
        </div>
        <div class="empty" id="empty">
          <p>Drag a sample in here.</p>
          <p class="small">Then tick some boxes and hit space.</p>
        </div>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
