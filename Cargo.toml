[workspace]
resolver = "2"
members = ["crates/engine", "src-tauri", "tools/starter-pack"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nathansherburn/weetbeats"

[workspace.dependencies]
weetbeats-engine = { path = "crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtrb = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Debug builds still have to keep up with the audio thread.
[profile.dev.package."*"]
opt-level = 2
