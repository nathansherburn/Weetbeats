[package]
name = "weetbeats-engine"
description = "Weetbeats audio engine: sample decoding, step clock, voice pool, mixer, project files."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rtrb.workspace = true
# Hosting CLAP instruments. `clack-host` is the API; the extensions are the parts of it a
# host needs to know a plugin's ports, take its notes, move its parameters and save its
# settings. Everything else CLAP defines is left switched off.
clack-host = "0.1"
clack-extensions = { version = "0.1", features = [
    "clack-host",
    "audio-ports",
    "note-ports",
    "params",
    "state",
] }
serde.workspace = true
serde_json.workspace = true
# Every format the picker offers has to have a reader here, or a file passes the extension
# filter and then fails to decode after it has already been copied into the project. aiff
# and caf are not in symphonia's defaults; wav and ogg are.
symphonia = { version = "0.6", features = [
    "mp3",
    "flac",
    "vorbis",
    "ogg",
    "aac",
    "alac",
    "isomp4",
    "aiff",
    "caf",
] }

[dev-dependencies]
# Built as a side effect of `cargo test`, which is what puts a real `.clap` beside the test
# binary for `tests/plugins.rs` to load. Nothing in this crate uses it as a library.
weetbeats-test-clap = { path = "../../tools/test-clap" }
