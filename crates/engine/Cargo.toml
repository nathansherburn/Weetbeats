[package]
name = "weetbeats-engine"
description = "Weetbeats audio engine: sample decoding, step clock, voice pool, mixer, project files."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rtrb.workspace = true
serde.workspace = true
serde_json.workspace = true
# Every format the picker offers has to have a reader here, or a file passes the extension
# filter and then fails to decode after it has already been copied into the project. aiff
# and caf are not in symphonia's defaults; wav and ogg are.
symphonia = { version = "0.6", features = [
    "mp3",
    "flac",
    "vorbis",
    "ogg",
    "aac",
    "alac",
    "isomp4",
    "aiff",
    "caf",
] }
